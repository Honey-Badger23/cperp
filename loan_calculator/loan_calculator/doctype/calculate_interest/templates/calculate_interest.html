{% extends "templates/web.html" %}

{% block page_content %}
<h1 style="color: #22c384;">Interest Calculator</h1>

<form id="interest-calculator-form" style="background-color: #0f0f0f; color: #ebfbf9; padding: 20px; border-radius: 8px; width: 300px; margin: auto;">
  <label for="balance" style="display: block; margin-bottom: 10px;">Balance:</label>
  <input type="number" id="balance" name="balance" value="{{ balance }}" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #22c384;" min = "0">
  
  <label for="annual_rate" style="display: block; margin-bottom: 10px;">Annual Rate (%):</label>
  <input type="number" id="annual_rate" name="annual_rate" value="{{ annual_rate }}" required style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #22c384;" min = "0">
  
  <label for="periods" style="display: block; margin-bottom: 10px;">Periods:</label>
  <input type="number" id="periods" name="periods" value="{{ periods }}" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #22c384;">
  
  <label for="calculation_method" style="display: block; margin-bottom: 10px;">Calculation Method:</label>
  <select id="calculation_method" name="calculation_method" style="width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 4px; border: 1px solid #22c384;">
    <option value="monthly" {% if calculation_method == 'monthly' %}selected{% endif %}>monthly</option>
    <option value="monthly_compounded" {% if calculation_method == 'monthly_compounded' %}selected{% endif %}>monthly_compounded</option>
    <option value="daily" {% if calculation_method == 'daily' %}selected{% endif %}>daily</option>
    <option value="daily_compounded" {% if calculation_method == 'daily_compounded' %}selected{% endif %}>daily_compounded</option>
  </select>
  
  <button type="button" onclick="calculateInterest()" style="background-color: #22c384; color: #0f0f0f; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">Calculate</button>
</form>

<h3 style="color: #22c384;">Calculated Interest: R <span id="calculated-interest" style="color: #22c384;">00.00</span></h3>

<script>
  function calculateInterest() {
    const balance = document.getElementById('balance').value;
    const annual_rate = document.getElementById('annual_rate').value;
    const periods = document.getElementById('periods').value || 1;
    const calculation_method = document.getElementById('calculation_method').value;

    frappe.call({
      method: "loan_calculator.loan_calculator.doctype.calculate_interest.calculate_interest.calculate_interest",
      args: { balance, annual_rate, periods, calculation_method },
      callback: function(response) {
        console.log("Full Response: ", response);

        if (response.message && response.message.message !== undefined) {
          let interest = response.message.message;

          console.log("Interest Type: ", typeof interest);

          interest = Number(interest);

          if (!isNaN(interest)) {
            document.getElementById('calculated-interest').innerText = interest.toFixed(2);
          } else {
            document.getElementById('calculated-interest').innerText = "Invalid interest value.";
          }
        } else {
          console.error("Error: No interest data found in response.");
          document.getElementById('calculated-interest').innerText = "Error calculating interest.";
        }
      }
    });
  }
</script>

{% endblock %}
